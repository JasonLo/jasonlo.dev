name: CI

# Validates PRs before merge. Without this, `astro check` only ran on main
# after a merge, so a type error reached the deploy job before anyone saw it.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Formatting + lint on .ts/.mjs/.json. Astro files are covered by the
      # `astro check` in the build step below, which understands their template.
      - name: Lint
        run: bun run lint

      # `bun run build` runs `astro check` (type-check) before building.
      # `scripts/` is included in that check, so the sync and image generators
      # are type-checked here too.
      - name: Type-check and build
        run: bun run build
